name: MATSim Weekly Newsletter

on:
  schedule:
    # Mondays 06:00 UTC (= 07:00/08:00 Swiss time)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to cover'
        default: '7'

permissions:
  contents: read
  models: read

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and send newsletter
        run: node src/newsletter.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ inputs.days || '7' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
